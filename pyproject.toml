[project]
name = "aegis-platform"
version = "0.1.0"
description = "Aegis platform is a Production-grade AI Agent Platform for scalable, observable, and evaluatable AI workloads."
readme = "README.md"
authors = [
    { name = "kader", email = "kaderbv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.12",
    "langchain-text-splitters>=0.1.0",
    "openai>=3.24.0",
    "pydantic-settings>=2.15.0",
    "pytest-asyncio>=1.4.0",
    "uvicorn>=0.54.0",
    "qdrant-client>=1.20.0",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "sentence-transformers>=6.3.0",
    "en-core-web-lg",
    "python-dotenv>=1.2.4",
]

[project.scripts]
aegis-platform = "aegis_platform:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9"
]

[tool.ruff]
line-length = 100
lint.ignore = ["B008"]  # FastAPI Depends pattern is intentional

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
