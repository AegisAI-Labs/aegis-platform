[project]
name = "aegis-platform"
version = "0.1.0"
description = "Aegis platform is a Production-grade AI Agent Platform for scalable, observable, and evaluatable AI workloads."
readme = "README.md"
authors = [
    { name = "kader", email = "kaderbv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
aegis-platform = "aegis_platform:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
