version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aegis-qdrant
    ports:
      - "6333:6333"      # REST API
      - "6334:6334"      # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # Uncomment to set API key for Qdrant
      # - QDRANT_API_KEY=your-api-key-here
      - QDRANT_TELEMETRY_DISABLED=false
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local

networks:
  aegis-network:
    driver: bridge
